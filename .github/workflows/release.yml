name: release
run-name: "release ${{ inputs.version }}"

# Builds the QueryAI CLI and publishes the binaries to the PUBLIC distribution
# repository. The source repository is private, and GitHub release assets inherit
# their repository's visibility - so releases published here would be downloadable
# only by people who can already read the source. Publishing to a separate public
# repo is what lets users install without the source ever being shared.
#
# The upstream publish.yml is deliberately not reused: every job in it is gated on
# `github.repository == 'QueryAI-org/QueryAI'` and it expects Blacksmith runners,
# AUR/npm/SST credentials and Windows code signing. This is the subset that
# actually gets a working binary into users' hands.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ inputs.version }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Must match ModelsDev.MIRROR_SOURCE, Release.repo and the installer's REPO.
      DIST_REPO: ${{ vars.DIST_REPO || 'QueryAI-org/QueryAI' }}
      # A PAT (or app token) with contents:write on DIST_REPO. The built-in
      # GITHUB_TOKEN cannot write to another repository.
      GH_TOKEN: ${{ secrets.DIST_TOKEN }}
      # Job-level so the npm step can test it in `if:` - the secrets context is
      # not available in a step-level condition.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install

      - name: Create the release
        run: |
          set -euo pipefail
          # build.ts uploads into an existing release, so it has to exist first.
          if gh release view "v${{ inputs.version }}" --repo "$DIST_REPO" >/dev/null 2>&1; then
            echo "Release v${{ inputs.version }} already exists, reusing it"
          else
            gh release create "v${{ inputs.version }}" \
              --repo "$DIST_REPO" \
              --title "v${{ inputs.version }}" \
              --notes "QueryAI v${{ inputs.version }}" \
              ${{ inputs.draft && '--draft' || '' }}
          fi

      - name: Build and upload binaries
        run: ./packages/queryai/script/build.ts
        env:
          QUERYAI_VERSION: ${{ inputs.version }}
          # Set to any non-empty value: this is what makes build.ts archive the
          # binaries and upload them, rather than only compiling them.
          QUERYAI_RELEASE: "1"
          GH_REPO: ${{ env.DIST_REPO }}

      - name: Verify the release has assets
        run: |
          set -euo pipefail
          # A release with no assets is worse than a failed build: the installer
          # would find the tag, then 404 on the download.
          count=$(gh release view "v${{ inputs.version }}" --repo "$DIST_REPO" \
            --json assets --jq '.assets | length')
          echo "assets: $count"
          [ "$count" -gt 0 ]

      - name: Publish to npm
        # Optional: without NPM_TOKEN the release still ships binaries through
        # the installer, it just does not gain `npm i -g queryai`.
        if: ${{ !inputs.draft && env.NPM_TOKEN != '' }}
        env:
          QUERYAI_VERSION: ${{ inputs.version }}
          # Pinned rather than derived: the fallback is the git branch name, so a
          # release cut from `dev` would publish under the `dev` tag and
          # `npm i -g queryai` would never see it.
          QUERYAI_NPM_TAG: latest
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          ./packages/queryai/script/publish-npm.ts
        # Reuses ./dist from the build step above, so it must stay in this job.
