name: catalog

# Mirrors the models.dev catalog into this repository so a QueryAI install does
# not depend on anyone else's host staying up. The CLI reads
# <raw.githubusercontent>/<repo>/catalog/api.json; see ModelsDev.DEFAULT_SOURCE.
#
# The catalog lives on its own orphan branch rather than on the default branch,
# so a 4 MB file changing every day never touches the source history.

on:
  schedule:
    # Daily. New models appear often enough to matter and rarely enough that
    # hourly would be noise.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the upstream catalog
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o api.json https://models.dev/api.json
          # A truncated or error-page response must never be published: the CLI
          # caches whatever it gets for the whole session.
          jq -e 'type == "object" and (keys | length) > 10' api.json > /dev/null
          echo "providers: $(jq 'keys | length' api.json)"

      - name: Publish to the catalog branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q mirror
          cd mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Orphan branch, single commit: the history of a mirror has no value
          # and a daily 4 MB diff would bloat the repository within a year.
          git checkout -q --orphan catalog
          cp ../api.json api.json
          printf '%s\n' \
            "Mirror of https://models.dev/api.json for the QueryAI model catalog." \
            "Generated by .github/workflows/catalog.yml - do not edit by hand." > README.md
          git add api.json README.md
          git commit -q -m "catalog: $(date -u +%Y-%m-%d)"
          git push -q --force origin catalog
