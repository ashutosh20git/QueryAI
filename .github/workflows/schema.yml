name: schema

# Publishes the JSON Schema for queryai.json, generated from the config schema in
# packages/core, to the `schema` branch. Config files carry it as their $schema
# (see ConfigV1.SCHEMA_URL), so editors validate against this project's own keys
# rather than another project's.

on:
  push:
    branches: [dev]
    paths:
      - "packages/core/src/v1/config/**"
      - "packages/core/src/config/**"
      - "packages/core/script/schema.ts"
      - ".github/workflows/schema.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schema
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Generate
        run: |
          set -euo pipefail
          bun run --cwd packages/core script/schema.ts ../../config.json
          # A schema that does not describe the keys we ship is worse than none:
          # editors would flag valid config as invalid.
          jq -e '.["$defs"].Config.properties | has("memory") and has("fallback")' config.json > /dev/null
          echo "bytes: $(wc -c < config.json)"

      - name: Publish to the schema branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out && cp config.json out/config.json
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan schema
          printf '%s\n' \
            "JSON Schema for queryai.json, generated from packages/core/src/v1/config/config.ts." \
            "Generated by .github/workflows/schema.yml - do not edit by hand." > README.md
          git add config.json README.md
          git commit -q -m "schema: ${GITHUB_SHA::7}"
          git push -q --force origin schema
